# Checks every push and pull request: the Go package that bundles the files
# builds (every embedded file exists), and the JavaScript parses.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go build ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript
        run: for f in app.js overfin.js; do node --check "$f"; done
